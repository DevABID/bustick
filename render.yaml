# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the Django API and the React site. You supply the Postgres DATABASE_URL.
# Values marked `sync: false` are asked for in the dashboard when you create the Blueprint.

# Database: Render allows only ONE free Postgres per account, so this blueprint does not create one.
# Set DATABASE_URL yourself (see README section 6): your existing Render database, or any Postgres
# provider such as Neon or Supabase.

services:
  # ---------- Django API ----------
  - type: web
    name: bustick-api
    runtime: python
    plan: free
    rootDir: ticket_system
    buildCommand: ./build.sh
    startCommand: gunicorn ticket_system.wsgi:application --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL           # postgresql://user:password@host:5432/dbname
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL            # e.g. https://bustick.onrender.com  (the React site's URL)
        sync: false
      - key: CORS_ALLOWED_ORIGINS    # same value as FRONTEND_URL
        sync: false
      - key: CSRF_TRUSTED_ORIGINS    # same value as FRONTEND_URL
        sync: false
      # Payments. Portfolio demo: demo + ALLOW_DEMO_PAYMENTS=True. Real shop: sslcommerz + keys.
      - key: PAYMENT_PROVIDER
        value: demo
      - key: ALLOW_DEMO_PAYMENTS
        value: "True"
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: SSLCOMMERZ_SANDBOX
        value: "True"
      # Email over HTTPS (Render free services block SMTP)
      - key: EMAIL_BACKEND
        value: booking.email_backends.BrevoEmailBackend
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL      # a sender address verified in Brevo, e.g. BusTick <you@gmail.com>
        sync: false
      - key: SUPPORT_EMAIL
        value: arabid8427@gmail.com
      # Admin login, created on deploy (Shell isn't available on the free plan)
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # True = add demo routes and trips on each deploy (good for a portfolio site)
      - key: SEED_DEMO
        value: "True"

  # ---------- React site ----------
  - type: web
    name: bustick
    runtime: static
    rootDir: ticket-ui
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite              # let React Router handle /buses, /seats/1, ...
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL     # the API's URL, e.g. https://bustick-api.onrender.com
        sync: false
